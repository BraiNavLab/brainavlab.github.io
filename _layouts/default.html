<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        {% seo %}
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
              integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
              crossorigin="anonymous">
        <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
              integrity="sha384-PPIZEGYM1v8zp5Py7UjFb79S58UeqCL9pYVnVPURKEqvioPROaVAJKKLzvH2rDnI"
              crossorigin="anonymous">
        <link rel="stylesheet" href="{{ '/css/group.css' | relative_url }}">
        {% if site.restyle %}
            <link rel="preload" href="{{ '/fonts/geist-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
            <link rel="stylesheet" href="{{ '/css/restyle.css' | relative_url }}">
        {% endif %}
        <link rel="icon" type="image/png" href="{{ '/img/LogoBrainavLab_only_brain.png' | relative_url }}">
    </head>
    <body>
        <div class="container-fluid">
            <!-- Column on small screens, spaced out row on larger ones -->
            <header class="header d-flex flex-column flex-md-row justify-content-md-between">
                <a href="{{ '/' | relative_url }}">
                    <img src="{{ '/img/LogoBraiNavLab_bg_transp.png' | relative_url }}" alt="BraiNavLab" id="logo" width="840" height="142">
                </a>
                {% include topnav.html %}
            </header>

            <main>
                {% if page.image %}
                    <img src="{{ page.image | relative_url }}" alt="{{ page.title | escape }}" class="page-hero img-fluid mx-auto d-block mb-4">
                {% endif %}

                {% unless page.notitle %}
                    <h1 class="section-title">{{ page.title }}</h1>
                    <hr>
                {% endunless %}

                {{ content }}
            </main>

            <footer class="footer">
                <p>
                    <a href="https://www.dimi.univr.it/">Department of Engineering for Innovation Medicine</a>,
                    <a href="https://www.univr.it/">University of Verona</a>
                </p>
            </footer>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
                crossorigin="anonymous"></script>
        <script src="{{ '/js/site.js' | relative_url }}"></script>
        {% if site.restyle %}<script src="{{ '/js/restyle.js' | relative_url }}"></script>{% endif %}
    </body>
</html>
