# Site identity, also used by jekyll-seo-tag for titles and search engines.
title: BraiNavLab
description: "Research in neuroimaging, neurophysiology, brain connectivity and AI"
url: "https://brainavlab.github.io"
baseurl: ""   # set explicitly, so that GitHub Pages does not have to guess it

# GitHub Pages would otherwise add the stylesheet of a default theme that the site does not use.
theme: null

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Files in the repository that must not be published.
exclude: [README.md, CURATORS_GUIDE.md, LICENSE, Gemfile, Gemfile.lock, build_site.sh, back_up_stuff, vendor]

# Optional restyling layer (css/restyle.scss, js/restyle.js, _includes/home-hero.html, fonts/).
# Set to false to go back to the plain style.
restyle: true

# 3D brain under the Mission title of the home page, turning with the scroll (js/brain-mesh.js, img/home_img/brain_mesh.bin).
# Set to false to remove it.
brain_mesh: true

# Also publish items with a future date, such as an event announced in advance.
future: true

# Number of news items in the home page carousel.
front_page_news: 8

collections:
  projects:
    output: true
    permalink: /projects/:path.html
  news:
    output: true
    permalink: /news/:name/

# Every news item uses the post layout without having to declare it.
defaults:
  - scope:
      path: ""
      type: news
    values:
      layout: post

# Navigation bar links. "collection" keeps the item active on the pages of that collection.
# "icon" shows the item as an icon instead of its title. Icons: https://fontawesome.com/v6/icons
navigation:
  - title: Home
    link: /
  - title: "News & Events"
    link: /pages/news.html
    collection: news
  - title: People
    link: /pages/lab_member.html
  - title: Research Topics
    link: /pages/research_projects.html
    collection: projects
  - title: Funded Projects
    link: /pages/funded_projects.html
  - title: Contacts
    link: /pages/contacts.html
  - title: Publications
    link: "https://scholar.google.com/citations?user=hd5zn0YAAAAJ&hl=en"
    external: true
  - title: GitHub
    link: https://github.com/orgs/BraiNavLab
    external: true
    icon: fa-brands fa-github
  - title: LinkedIn
    link: https://www.linkedin.com/company/brainavlab
    external: true
    icon: fa-brands fa-linkedin

# Social links shown on the home page.
social_links:
  - title: LinkedIn
    link: https://www.linkedin.com/company/brainavlab
    icon: fa-brands fa-linkedin
  - title: GitHub
    link: https://github.com/orgs/BraiNavLab
    icon: fa-brands fa-github
  - title: Google Scholar
    link: "https://scholar.google.com/citations?user=hd5zn0YAAAAJ&hl=en"
    icon: fa-brands fa-google-scholar
