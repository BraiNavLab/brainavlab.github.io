# Markers of the world map on the home page, in the order of the list shown on small screens.
# Their institutions are the blocks with the same "location" in _data/partners.yml.
# id: name used by _data/partners.yml and _data/map_shapes.yml.
# x, y: tip of the marker, in pixels of img/home_img/world_map_base.png (2400 x 1286).
# label_x, label_y: where the country name is anchored on the map, on the side of the line.
# side: where the name sits compared with the marker. "left" aligns the text to the right, so the line always starts next to it.
# curve: the two control points of the line from the name to the tip of the marker, in pixels ("x1 y1 x2 y2").
# For a line that enters the tip straight from below, put the second point exactly under the tip (same x).
# popup: below opens the pop-up under the marker instead of above it, so that it does not cover the markers nearby.

- id: italy
  name: Italy
  x: 1224
  y: 658
  label_x: 1307
  label_y: 729
  side: right
  curve: "1255 717 1224 705"
  popup: below

