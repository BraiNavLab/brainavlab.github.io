# Partners of the lab. The logos scroll on the home page in this order: Italy, United States, then the rest of Europe by country.
# name: shown on the world map and in its pop-ups. url: their website (without it, the name and the logo are not links).
# logo: file in img/partners/ (without it, the partner appears only on the map).
# height: display height of the logo in pixels (default 56), to balance the logos visually.
# location: marker of the world map, see _data/map_locations.yml. city: optional, shown in the pop-up.

