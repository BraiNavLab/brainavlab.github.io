giorgio_dolci:
    display_name: "Giorgio Dolci"
    display_role: Ph.D. Student
    status_group: active
    email: giorgio.dolci@univr.it
    image: /img/people/giorgio_dolci.jpeg
    bio: Giorgio Dolci received his B.S. in Bioinformatics and M.S. in Medical Bioinformatics cum laude from the University of Verona in 2023. He is currently a PhD student in Computer Science at the University of Verona. He took a position as an external researcher at the Tri-Institutional Center for Translational Research in Neuroimaging and Data Science (TReNDS), Georgia State University, Georgia Institute of Technology, Emory University, Atlanta, GA, USA, from March 2022 to July 2022, and from May 2023 to August 2023, under the supervision of Prof. Vince D. Calhoun. Additionally, he completed two different internships at the BraiNavLab under the supervision of Prof. Gloria Menegaz. His research interests include 1) Magnetic Resonance Imaging processing and analysis; 2) Genetics data analysis; 3) Artificial Intelligence models applied to biomedical and clinical domains, with more focus on deep learning; 4) Integration and fusion of heterogeneous data through deep multimodal learning architectures; 5) Application and validation of eXplainable Artificial Intelligence methods in clinical and biomedical domains.
