edoardo_paolini:
    display_name: "Edoardo Paolini"
    display_role: Ph.D. Student
    status_group: active
    email: edoardo.paolini@univr.it
    image: /img/people/edoardo_paolini.jpg
    bio: Edoardo Paolini is a Ph.D. student at the Dept. of Computer Science, University of Verona, Italy. He received the B.S. in Computer Science from the University of Verona (2020) and the M.S. in Quantitative and Computational Biology from the University of Trento (2023). For his Bachelor's thesis, he investigated the reliability of several functional connectivity (FC) and graph metrics applied to resting-state functional magnetic resonance imaging (rs-fMRI) data, while for his Master's thesis, he investigated part of the metabolic pathways of Mycobacterium tuberculosis in the field of systems biology. He is currently applying multivariate statistical techniques to analyse brain connectivity in patients at different stages of Alzheimer's disease (AD) and developing EEG-TMS systems based on brain connectomics for personalized treatment of epilepsy.
