irene_treccani:
    display_name: "Irene Treccani"
    display_role: Ph.D. Student
    status_group: active
    email: irene.treccani_02@univr.it
    image: /img/people/irene_treccani.jpg
    bio: Irene Treccani received her B.Sc. in Bioinformatics and M.Sc. in Medical Bioinformatics from the University of Verona in 2023. She currently holds the position of Research Fellow in BraiNavLab at the University of Verona. For her Master's thesis, she conducted an analysis of genetic data from patients affected by Major Depressive Disorder to compute the Polygenic Risk Score. She is involved in a project entitled “AntIAGING - Artificial Intelligence for Healthy Aging”, and her main research focus is centered around conducting genetics data analysis to investigate the phenotype-genotype mapping concerning Alzheimer's disease and cardiovascular diseases.
