nicola_vale:
    display_name: "Nicola Valè"
    display_role: PostDoc
    status_group: active
    email: nicola.vale@univr.it
    image: /img/people/nicola_vale.jpg
    bio: After graduating in physics in 2012, Nicola Valè turned his interest toward rehabilitation, receiving the Bachelor's degree in Physiotherapy and the Master's degree in Rehabilitation Sciences. He completed the Ph.D. degree in Neuroscience at the University of Verona in 2022. From 2016 to 2023 he worked at the Neuromotor and Cognitive Rehabilitation Research Center of the University of Verona as a research assistant, Ph.D. student and then postdoc researcher. His work focused on neurorehabilitation, motor control and movement analysis. He joined the BraiNavLab in 2024 as a postdoc researcher working on a funded research project on the use of eXplainable AI for the study of brain connectivity and neuroplasticity.
