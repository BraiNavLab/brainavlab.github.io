virginia_filippi:
    display_name: "Virginia Filippi"
    display_role: Ph.D. Student
    status_group: active
    email: virginia.filippi@univr.it
    image: /img/people/virginia_filippi.jpg
    bio: Virginia Filippi obtained both her M.Sc. in Artificial Intelligence and B.Sc. in Bioinformatics cum laude from the University of Verona, where she is currently pursuing a PhD in Intelligent Systems Engineering. Her research investigates the use of machine learning and deep learning in neuroimaging, focusing on brain connectivity, graph signal processing, and interpretable AI for studying the relationship between brain structure and function in the context of neurodegenerative disorders such as Alzheimer's disease.
