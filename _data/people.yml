# People of the lab. status_group decides the section of the People page: active, collab or alumni.

####################### ACTIVE PEOPLE #######################
gloria_menegaz:
    display_name: "Gloria Menegaz"
    display_role: Full Professor
    status_group: active
    email: gloria.menegaz@univr.it
    image: /img/people/gloria_menegaz.jpg
    bio: "Gloria Menegaz is Professor of Bioengineering at the Dept. of Engineering for Innovation Medicine, University of Verona (Italy) and head of the BraiNavLab. She holds a PhD in Applied Sciences (EPFL 2000), an MSc in Electronic Engineering (1993) and a postgraduate Master's in information technology (1995) (Politecnico di Milano, Italy). From 2000 to 2002 she was first research assistant at the Telecommunications Lab (LCAV) of EPFL, headed by Prof. Martin Vetterli, which she left to join the Computer Science Dept. of the University of Fribourg (Switzerland) as an Assistant Professor. In 2004 she was awarded the Rita Levi Montalcini grant by the Italian Ministry of University and Research (MIUR) (DM 20/03/2003 n. 501) and joined the Dept. of Information Engineering of the University of Siena (Italy) as an Assistant Professor. In 2007 she joined the Dept. of Computer Science of the University of Verona (Italy) as an Associate Professor and became Full Professor in 2017. Prof. Menegaz is a Senior Member of the IEEE, the Signal Processing Society (SPS), Liaison representative of the IEEE-SPS and member of the steering committee of the IEEE Transactions on Medical Imaging (TMI), member of the Challenges and Data Collections Technical Committee of the SPS, Chair of the Technical Committee for Challenges and Data Collections of the IEEE Bio Imaging and Signal Processing (BISP) Committee (Co-chair Prof. Vince Calhoun, Georgia Institute of Technology), and member of the IEEE Women in Engineering. She is also a member of the Medical Image Computing and Computer Assisted Intervention Society (MICCAI) Special Interest Group on Biomedical Image Analysis Challenges (SIG-BIAC), of the Ad Hoc Group (AHG) on Digital Media Storage using DNA (JPEG DNA) and Observer for the DICOM WG-32 (Neurophysiology data). She is Associate Editor of the IEEE Transactions on Medical Imaging and Scientific Reports (Nature), and has served as Guest Editor of the IEEE-SPM and for other venues. She has been Vice-Chair for the FET-REA and the MSCA-IF for many years and Independent Expert for many international institutions including the European Science Foundation (ESF), SKF, Sweden, among others. She authored more than 130 publications in international journals and conference proceedings and has been chair, area chair and technical committee member of many international conferences, especially of the IEEE."
    links:
        - label: "ORCID"
          img: "/img/icons/orcid.png"
          url: "https://orcid.org/0000-0002-6889-3461"
        - label: "IRIS"
          img: "/img/icons/iris.png"
          url: "https://iris.univr.it/cris/rp/rp06455"
        - label: "Google Scholar"
          img: "/img/icons/scholar.png"
          url: "https://scholar.google.com/citations?user=hd5zn0YAAAAJ&hl=it&oi=ao"

silvia_francesca_storti:
    display_name: "Silvia Francesca Storti"
    display_role: Associate Professor
    status_group: active
    email: silviafrancesca.storti@univr.it
    image: /img/people/silvia_francesca_storti.jpg
    bio: Silvia F. Storti is Associate Professor in Bioengineering at the Department of Engineering for Innovation Medicine (DIMI) - University of Verona, where she conducts research in the field of neuroengineering. She works on the development of both active and passive brain computer interfaces, as well as on the processing of biomedical signals and images. Her research mainly concerns the design of intelligent systems for the analysis of multivariate and dynamic data, aimed at predicting brain states and estimating brain connectivity. Her activities include studies employing different combinations of neurotechnologies, EEG-TMS, wearable systems (EEG, EMG/IMU), and fMRI, to analyze neural plasticity and guide the design of personalized treatments. She received the M.Sc. degree in Electronic Engineering from the University of Padua and the Ph.D. degree in Neuroscience from the University of Verona. Since 2018, she has been part of the Department of Computer Science at the University of Verona as a researcher. In 2021, she became Associate Professor and, since March 2023, has been affiliated with the Department of Engineering for Innovation Medicine. She is a member of the BraiNavLab research group, supervises two PhD students and one post-doc, and is co-author of 69 peer-reviewed scientific publications in international journals, as well as over 100 contributions to leading conferences such as IEEE-EMBC and OHBM. Her scientific impact is reflected in an H-index of 24 (1,675 citations). She is a member of the IEEE Signal Processing Society and the Italian National Bioengineering Group and serves as Associate Editor for the IEEE Journal of Biomedical and Health Informatics and BioMedical Engineering OnLine.
    links:
        - label: "ORCID"
          img: "/img/icons/orcid.png"
          url: "https://orcid.org/0000-0002-8605-803X"
        - label: "IRIS"
          img: "/img/icons/iris.png"
          url: "https://iris.univr.it/cris/rp/rp06728"
        - label: "Google Scholar"
          img: "/img/icons/scholar.png"
          url: "https://scholar.google.com/citations?user=yOwnNEkAAAAJ&hl=it&oi=ao"

ilaria_boscolo_galazzo:
    display_name: "Ilaria Boscolo Galazzo"
    display_role: Associate Professor
    status_group: active
    email: ilaria.boscologalazzo@univr.it
    image: /img/people/ilaria_boscolo_galazzo.jpg
    bio: Ilaria Boscolo Galazzo is Associate Professor in Bioengineering at the Dept. of Computer Science, University of Verona. She graduated cum laude in Biomedical Engineering from the University of Padua (2010) and received the Ph.D. degree in Neuroscience from the University of Verona (May 2014). She took a position as Research Associate at the Institute of Nuclear Medicine, UCL, London from 2014 to 2016 and then at the Dept. of Computer Science, University of Verona from 2016 to July 2020 as Post-Doc in the BraiNavLab headed by Prof. Gloria Menegaz. From August 2020 she was RTDa and then RTDb in Bioengineering at the same Department. Her main research activities include imaging genetics, statistical/machine learning for neuroimaging data and multimodal integration, Arterial Spin Labeling and functional MRI modeling, and brain connectivity from non-invasive recordings. She is Associate Editor for IEEE Access and Review Editor for Frontiers in Neuroinformatics.
