silvia_saglia:
    display_name: "Silvia Saglia"
    display_role: Research Fellow
    status_group: active
    email: silvia.saglia@univr.it
    image: /img/people/silvia_saglia.jpeg
    bio: Silvia Saglia completed her M.Sc. in Neuroscience and Neuropsychological Rehabilitation at the University of Padua in 2020. She then focused on neuroimaging and computational methods. From 2021 to 2024 she worked at the IRCCS Centro San Giovanni di Dio Fatebenefratelli in Brescia on a Ministry of Health-funded clinical trial using network-based TMS in individuals at risk for Alzheimer’s disease. Her work focused on participant coordination and the processing and analysis of multimodal MRI data. She joined the BraiNavLab in 2024 as a research fellow, working on large-scale neuroimaging, brain connectivity, MRI/PET integration, imaging genetics, and AI methods applied to Alzheimer’s and Parkinson’s disease.
