    #bio: "Ettore Cinquetti received his B.S. degree in Computer Science, and his M.S. in Computer Science and Engineering, from the University of Verona, respectively in November 2019 and March 2022. His M.S. thesis is titled \"Multi-Channel Variational Autoencoder for Data Integration in Imaging Genetics\". Still bound to the University of Verona, he's now a research collaborator, working with the BraiNavLab group. He's currently focused on the following topics: 1) deep learning and neural networks, 2) multivariate signal analysis and processing, and 3) BCI."

