{% comment %} Photo, name and email of a person, used in the People list of a research topic. Parameter: person. {% endcomment %}
{% assign person = include.person %}

<div class="person row align-items-center">
    <div class="col-auto">
        {% include person-image.html person=person %}
    </div>
    <div class="col ps-0">
        <p class="h6 person-name">{{ person.display_name }}</p>
        {% if person.email %}<p class="email">{{ person.email }}</p>{% endif %}
    </div>
</div>
