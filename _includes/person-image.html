{% comment %} Round photo of a person, or their initial when there is no photo. Parameter: person. {% endcomment %}
{% assign person = include.person %}

{% if person.image %}
    <img class="rounded-circle profile" alt="{{ person.display_name }}" title="{{ person.display_name }}" src="{{ person.image | relative_url }}" loading="lazy">
{% else %}
    <svg class="profile noprofile" role="img" aria-label="{{ person.display_name }}" viewBox="0 0 100 100">
        <title>{{ person.display_name }}</title>
        <circle r="50" cx="50" cy="50" />
        <text x="50" y="50" font-size="70" text-anchor="middle" dominant-baseline="central">{{ person.display_name | slice: 0 }}</text>
    </svg>
{% endif %}
